<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Destinations – Alpine Ascents</title>
    <meta name="description" content="Famous mountains and general facts.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/climbing/alpine-mark.svg">
</head>

<body data-page="destinations">
    <div id="nav"></div>
    <main>
        <section>
            <div class="wrap rv">

                <div id="grid" class="grid" aria-live="polite">Loading…</div>
            </div>
        </section>
    </main>
    <div id="foot"></div>
    <script src="js/media.js"></script>
    <!-- The local assistant answers from this site's mountain-climbing data only. -->
